services:
  # ----------------------------------------------------------------------------
  # Backing Database: MongoDB 7
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7-jammy
    container_name: aurora-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce_prod
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Backend API: Express 5 Modular Monolith
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurora-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ecommerce_prod
      SESSION_SECRET: production_compose_secret_min_32_characters_1234567890
      OTP_SECRET: production_otp_secret_min_32_characters_1234567890
      FRONTEND_URL: http://localhost:3000
      RAZORPAY_KEY_ID: rzp_test_placeholder_key_id
      RAZORPAY_KEY_SECRET: placeholder_key_secret_1234567890
      RAZORPAY_WEBHOOK_SECRET: placeholder_webhook_secret_1234567890
    depends_on:
      mongo:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Frontend SPA: React 19 + Nginx
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: aurora-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
