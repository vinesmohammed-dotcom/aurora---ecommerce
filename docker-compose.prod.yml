# ==============================================================================
# Aurora E-Commerce — Production Docker Compose Configuration (AWS EC2)
# ==============================================================================
# Used for single-node EC2 production deployment. Connects to MongoDB Atlas.
# Enforces least-privilege networking, container health probes, and log rotation.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================================================

networks:
  aurora-prod-net:
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (Node.js 20 Express 5 REST API)
  # ----------------------------------------------------------------------------
  aurora-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurora-backend-prod
    restart: unless-stopped
    ports:
      # Bound strictly to localhost so port 5000 is never exposed to public internet
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - OTP_SECRET=${OTP_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-aurora-media-assets}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL:-noreply@aurora-store.example.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    networks:
      aurora-prod-net:
        aliases:
          - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Frontend & Reverse Proxy Service (Nginx Alpine + Compiled React Assets)
  # ----------------------------------------------------------------------------
  aurora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: aurora-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt certificates generated by Certbot on the host EC2
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      aurora-backend:
        condition: service_healthy
    networks:
      - aurora-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
